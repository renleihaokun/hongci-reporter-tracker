name = "hongci-report-tracker"
compatibility_date = "2024-09-25"
pages_build_output_dir = "public"

# D1 绑定请在 Pages 控制台配置（Settings → Bindings → Add → D1 database）：
#   变量名必须填 DB，选择你创建的数据库（如 hongci-reports）
# 不要在本文件里写 [[d1_databases]]：database_id 属于各账号私有，
# 占位符或他人 ID 提交进仓库会导致 Pages Git 集成部署校验失败（Error 8000022）。
# 建表 SQL 见 schema.sql，可在 Dashboard 的 D1 Console 直接粘贴执行。

# 环境变量（建议在 Pages 控制台 Settings → Environment variables 配置，不要写真实值进仓库）：
#   PATIENT_PID     必填，住院号（六位数字）
#   HOSPITAL_BASE   可选，医院查询系统地址，默认 http://wx.hcxyb.cn:88/
#   LLM_BASE_URL    可选，OpenAI 兼容接口地址（如 https://api.openai.com/v1 或国产模型网关）
#   LLM_API_KEY     可选，大模型 API Key
#   LLM_MODEL       可选，模型名，默认 gpt-4o-mini
